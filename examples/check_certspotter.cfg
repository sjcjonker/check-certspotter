# Adjust the domains and plugin path for your installation.
define command {
    command_name    check_certspotter
    command_line    $USER1$/check_certspotter.py --domain example.com --domain example.net --poll-interval 21600 --warning-duration 3600
}

# Local checks run hourly; cached warnings must not repeat notifications.
# API failures remain visible as
# UNKNOWN but only WARNING results notify in this example.
define service {
    name                    certspotter-service
    use                     generic-service
    register                0
    check_interval          60
    retry_interval          60
    max_check_attempts      1
    is_volatile             0
    notification_interval   0
    notification_options    w
}

define service {
    use                     certspotter-service
    host_name               nagios.example.com
    service_description     Certificate Transparency
    check_command           check_certspotter
}
